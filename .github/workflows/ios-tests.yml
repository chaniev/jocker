name: iOS Tests

on:
  push:
  pull_request:

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Run Xcode Tests
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Verify changes and mandatory CI checks
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base=HEAD
          fi
          make harness-ci BASE="$base"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-test-artifacts
          path: |
            .derivedData/harness-runs
            !.derivedData/harness-runs/**/build/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
